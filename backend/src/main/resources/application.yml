server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: smart-college-portal
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:college_portal}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=utf8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: CollegePortalHikariPool
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        generate_statistics: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    clean-disabled: true
  cache:
    type: caffeine
    cache-names:
      - student_dashboard
      - timetables
      - grade_scale
      - settings
      - departments
      - programmes
    caffeine:
      spec: maximumSize=2000,expireAfterWrite=60s
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:c21hcnQtY29sbGVnZS1wb3J0YWwtc3VwZXItc2VjcmV0LWtleS0yMDI2LXNlY3VyZQ==}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:15}
    refresh-expiry-days: ${REFRESH_TOKEN_EXPIRY_DAYS:7}
  aes:
    key: ${AES_KEY:kkQyevX5K+XCy02w28oTsjOT57EeldRveONZpfIev+4=}
  admin:
    email: ${ADMIN_EMAIL:admin@college.local}
    password: ${ADMIN_PASSWORD:Admin@12345}
  default-password: ${DEFAULT_PASSWORD:ChangeMe@123}
  send-password-in-email: ${SEND_PASSWORD_IN_EMAIL:false}
  temp-password-mode: ${TEMP_PASSWORD_MODE:default}
  mail:
    from: ${MAIL_FROM:noreply@college.local}
  base-url: ${APP_BASE_URL:http://localhost:5173}
  cors: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost}
  seed-demo: ${SEED_DEMO_DATA:true}
