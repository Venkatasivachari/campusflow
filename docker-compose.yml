name: smart-college-portal

services:
  # 1. Local MySQL 8 Database
  db:
    image: mysql:8.4
    container_name: portal-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Secret@12345}
      MYSQL_DATABASE: ${DB_NAME:-college_portal}
      TZ: Asia/Kolkata
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - portal-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 2. Spring Boot 3 + JDK 21 REST API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portal-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-college_portal}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-Secret@12345}
      AES_KEY: ${AES_KEY:-kkQyevX5K+XCy02w28oTsjOT57EeldRveONZpfIev+4=}
      JWT_SECRET: ${JWT_SECRET:-c21hcnQtY29sbGVnZS1wb3J0YWwtc3VwZXItc2VjcmV0LWtleS0yMDI2LXNlY3VyZQ==}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-60}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@college.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      CORS_ALLOWED_ORIGINS: "*"
      JAVA_OPTS: "-Xms256m -Xmx512m -Djava.security.egd=file:/dev/./urandom"
    networks:
      - portal-net
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # 3. React + Vite + Nginx Web Portal
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portal-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - portal-net

volumes:
  db_data:

networks:
  portal-net:
    driver: bridge
